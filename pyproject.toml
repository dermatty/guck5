[project]
    name = "guck5"
    version = "0.2.0"
    requires-python = ">=3.14"
    dependencies = [
        "a2wsgi>=1.10.10",
        "fastapi[standard]>=0.162.0",
        "gunicorn>=26.2.0",
        "rom>=1.1.2",
        "uvicorn>=0.54.0",
]
    
[build-system]
requires = ["uv_build>=0.11.2,<0.14"]
build-backend = "uv_build"
    
[tool.uv.build-backend]
module-name = "guck5"
module-root = ""        

[project.scripts]
guck5 = "guck5.guck5:start"
        
[tool.fastapi]
entrypoint = "guck5.app.api:app"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
]



